<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>د. رضا الأتربي | ألعاب القواعد النحوية | الصف الثاني الثانوي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f0f4f8; --ink:#0f172a; --muted:#475569;
    --g900:#08303b; --g800:#0f4c5c; --g700:#13596b; --g500:#1b7f94; --g100:#e4f3f6;
    --gold:#f59e42; --gold-l:#fde3c4; --card:#ffffff; --line:#e2e8f0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  header{background:linear-gradient(135deg,var(--g900),var(--g800),var(--g700));color:#fff;padding:34px 16px 80px;text-align:center;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:60px;background:var(--bg);clip-path:ellipse(75% 100% at 50% 100%)}
  .hero{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;max-width:1000px;margin:auto;position:relative;z-index:1}
  .hero img{width:340px;max-width:80vw;height:auto;aspect-ratio:1/1;border-radius:28px;object-fit:cover;border:4px solid var(--gold);box-shadow:0 10px 24px rgba(0,0,0,.4);background:#fff}
  .hero h1{font-size:2.3rem;font-weight:900;line-height:1.3}
  .badge{display:inline-block;margin:8px 0 6px;padding:6px 22px;border-radius:999px;background:rgba(255,255,255,.14);border:2px solid var(--gold);color:var(--gold-l);font-weight:900;font-size:1.3rem}
  .hero p{color:#ffe2c2;font-weight:700;font-size:1.1rem}
  main{max-width:1000px;margin:-30px auto 40px;padding:0 16px;position:relative;z-index:2}
  .tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
  .tab{font-family:inherit;font-size:1.05rem;font-weight:800;padding:10px 20px;border-radius:14px;border:2px solid var(--g700);background:#fff;color:var(--g800);cursor:pointer;transition:.2s}
  .tab:hover{background:var(--g100)}
  .tab.active{background:var(--g800);color:#fff;border-color:var(--g800);box-shadow:0 6px 14px rgba(15,76,92,.35)}
  .grade{background:var(--card);border-radius:22px;box-shadow:0 8px 24px rgba(15,23,42,.08);padding:22px;margin-bottom:22px;border-top:6px solid var(--g500)}
  .grade-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .grade-head h2{font-size:1.6rem;font-weight:900;color:var(--g800)}
  .grade-head small{display:block;color:var(--muted);font-weight:600;font-size:.95rem}
  .lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .lesson{border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:.2s;background:#f8fcfd}
  .lesson:hover{border-color:var(--g500);transform:translateY(-2px)}
  .lesson .num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--g100);color:var(--g800);font-weight:900}
  .lesson .unit{color:#c2410c;font-weight:700;font-size:.9rem;margin-top:-6px}
  .lesson h3{font-size:1.2rem;font-weight:900;display:flex;align-items:center;gap:10px}
  .url{direction:ltr;text-align:left;font-size:.8rem;color:var(--muted);background:#f1f5f9;border-radius:10px;padding:6px 10px;overflow-wrap:anywhere;font-family:monospace}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font-family:inherit;font-weight:800;font-size:1rem;padding:9px 16px;border-radius:12px;border:none;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s}
  .btn-open{background:linear-gradient(to bottom,#1b7f94,#0f4c5c);color:#fff;flex:1;justify-content:center}
  .btn-copy{background:#fff;color:var(--g800);border:2px solid var(--g700)}
  .btn-copy.done,.btn-all.done{background:var(--g800);color:#fff;border-color:var(--g800)}
  .btn-all{background:var(--gold-l);color:#7c2d12;border:2px solid #f59e42;font-size:.95rem}
  .btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
  footer{text-align:center;padding:24px 16px 40px;color:var(--muted);font-weight:700}
  footer b{color:var(--g800)}
  .wa{position:fixed;bottom:20px;left:20px;width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(37,211,102,.5);z-index:50}
  .wa svg{width:32px;height:32px;fill:currentColor}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--g900);color:#fff;padding:10px 22px;border-radius:12px;font-weight:800;transition:.3s;z-index:60}
  .toast.show{transform:translateX(-50%) translateY(0)}
  @media (max-width:600px){.hero h1{font-size:1.7rem}.hero img{width:260px;max-width:80vw}.grade{padding:16px}}
</style>
</head>
<body>
<header>
  <div class="hero">
    <div>
      <h1>د. رضا الأتربي</h1>
      <span class="badge">✒️ ألعاب القواعد النحوية</span>
      <p>الصف الثاني الثانوي — 6 دروس</p>
    </div>
  </div>
</header>

<main>
  <div id="grades"></div>
</main>

<footer>جميع الحقوق محفوظة &copy; | <b>د. رضا الأتربي</b> — 01098520443</footer>

<div class="toast" id="toast">تم نسخ الرابط ✅</div>

<script>
const GRADES = [
 {
  "id": "sec2",
  "name": "الصف الثاني الثانوي",
  "term": "الترم الأول",
  "lessons": [
   {
    "path": "sec2/1/",
    "title": "الأسماء الخمسة",
    "unit": "النحو - الوحدة الأولى"
   },
   {
    "path": "sec2/2/",
    "title": "الممنوع من الصرف",
    "unit": "النحو - الوحدة الثانية"
   },
   {
    "path": "sec2/3/",
    "title": "النعت",
    "unit": "النحو - الوحدة الثالثة"
   },
   {
    "path": "sec2/4/",
    "title": "البدل",
    "unit": "النحو - الوحدة الثالثة"
   },
   {
    "path": "sec2/5/",
    "title": "العطف",
    "unit": "النحو - الوحدة الثالثة"
   },
   {
    "path": "sec2/6/",
    "title": "التوكيد",
    "unit": "النحو - الوحدة الثالثة"
   }
  ]
 }
];

const abs = p => new URL(p, location.href).href;
const toastEl = document.getElementById('toast');
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(()=>toastEl.classList.remove('show'), 1800); }

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove(); return ok;
  }
}
function flash(btn, label){
  const old = btn.innerHTML; btn.classList.add('done'); btn.innerHTML = label;
  setTimeout(()=>{ btn.classList.remove('done'); btn.innerHTML = old; }, 1600);
}

const wrap = document.getElementById('grades');

GRADES.forEach(g => {

  const sec = document.createElement('section'); sec.className='grade'; sec.id=g.id;
  sec.innerHTML = `<div class="grade-head"><div><h2>📘 ${g.name}</h2><small>القواعد النحوية — ${g.term||'الترم الأول'} (${g.lessons.length} دروس)</small></div>
    <button class="btn btn-all">📋 نسخ كل روابط الصف</button></div><div class="lessons"></div>`;
  const list = sec.querySelector('.lessons');
  g.lessons.forEach((l, i) => {
    const url = abs(l.path);
    const card = document.createElement('div'); card.className='lesson';
    card.innerHTML = `<h3><span class="num">${i+1}</span>${l.title}</h3><div class="unit">${l.unit}</div>
      <div class="url">${url}</div>
      <div class="actions"><a class="btn btn-open" href="${l.path}" target="_blank">▶ دخول الدرس</a>
      <button class="btn btn-copy">🔗 نسخ الرابط</button></div>`;
    card.querySelector('.btn-copy').onclick = async e => {
      if (await copyText(url)) { flash(e.currentTarget, '✔ تم النسخ'); toast('تم نسخ رابط الدرس ✅'); }
    };
    list.appendChild(card);
  });
  sec.querySelector('.btn-all').onclick = async e => {
    const text = `📘 ${g.name} — القواعد النحوية (${g.term||'الترم الأول'})\nد. رضا الأتربي\n\n` +
      g.lessons.map((l,i)=>`${i+1}) ${l.title}:\n${abs(l.path)}`).join('\n\n');
    if (await copyText(text)) { flash(e.currentTarget, '✔ تم نسخ الروابط'); toast('تم نسخ روابط الصف كاملة ✅'); }
  };
  wrap.appendChild(sec);
});

</script>
</body>
